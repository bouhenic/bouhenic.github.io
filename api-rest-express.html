<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API REST — Express & MySQL — BTS CIEL</title>
<style>
  :root {
    --bg:       #0f1117;
    --bg2:      #181c27;
    --bg3:      #1e2336;
    --border:   #2a3050;
    --txt:      #cdd6f4;
    --txt2:     #8899cc;
    --txt3:     #55638a;
    --get:      #89b4fa; --get-bg: rgba(137,180,250,.13); --get-bd: rgba(137,180,250,.4);
    --post:     #a6e3a1; --post-bg:rgba(166,227,161,.13); --post-bd:rgba(166,227,161,.4);
    --put:      #f9e2af; --put-bg: rgba(249,226,175,.13); --put-bd: rgba(249,226,175,.4);
    --delete:   #f38ba8; --delete-bg:rgba(243,139,168,.13);--delete-bd:rgba(243,139,168,.4);
    --mono:     'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --sans:     'Sora', 'Nunito', system-ui, sans-serif;
    --radius:   10px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  /* HEADER */
  header {
    width: 100%; max-width: 960px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--get-bg), var(--post-bg));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--txt); }
  header p  { font-size: 12px; color: var(--txt3); margin-top: 2px; }

  /* MAIN CARD */
  .card {
    width: 100%; max-width: 960px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  /* NAV TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    gap: 0;
  }
  .tab {
    padding: 13px 20px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    color: var(--txt3);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .2s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: var(--sans);
  }
  .tab:hover { color: var(--txt2); }
  .tab.on    { color: var(--txt); border-bottom-color: var(--get); }

  /* CONTENT */
  .content { padding: 22px; min-height: 420px; }
  .desc-box {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 13.5px; color: var(--txt2); line-height: 1.75;
    margin-top: 14px;
  }

  /* METHOD BADGES */
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 11.5px;
    font-weight: 500; padding: 3px 10px; border-radius: 5px; border: 1px solid;
    cursor: pointer; transition: opacity .15s, box-shadow .15s;
  }
  .badge:hover { opacity: .8; }
  .badge.sel   { box-shadow: 0 0 0 2px currentColor; }
  .badge.GET    { color: var(--get);    background: var(--get-bg);    border-color: var(--get-bd); }
  .badge.POST   { color: var(--post);   background: var(--post-bg);   border-color: var(--post-bd); }
  .badge.PUT    { color: var(--put);    background: var(--put-bg);    border-color: var(--put-bd); }
  .badge.DELETE { color: var(--delete); background: var(--delete-bg); border-color: var(--delete-bd); }

  /* CODE BLOCK */
  .cb {
    background: #0a0d14; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: var(--mono); font-size: 12px;
    line-height: 1.7; white-space: pre; overflow-x: auto; color: var(--txt2);
  }

  /* 3-column arch layout */
  .arch { display: flex; align-items: stretch; gap: 6px; margin-top: 16px; }
  .arch-box {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px; background: var(--bg3); min-width: 0; transition: border-color .3s;
  }
  .arch-arrow { font-size: 20px; color: var(--txt3); align-self: center; flex-shrink: 0; }
  .arch-lbl { font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--txt3); margin-bottom: 8px; }

  /* TABLE */
  .db-tbl { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .db-tbl th, .db-tbl td {
    border: 1px solid var(--border); padding: 4px 12px;
    font-family: var(--mono); font-size: 12px; text-align: center;
  }
  .db-tbl th { background: var(--bg2); color: var(--txt2); }

  /* REQ PROPS */
  .rp-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg3);
    margin: 4px 0; cursor: pointer; transition: all .18s;
  }
  .rp-row:hover { border-color: var(--get-bd); }
  .rp-row.sel   { background: var(--get-bg);   border-color: var(--get-bd); }

  /* PHASE STRIP */
  .phase-strip { display: flex; align-items: stretch; gap: 3px; margin-bottom: 10px; }
  .phase-box {
    flex: 1; border: 1.5px solid var(--border); border-radius: 9px;
    padding: 10px 8px; background: var(--bg3); position: relative;
    transition: border-color .3s, background .3s; min-width: 0;
  }
  .phase-box.done { border-color: var(--post-bd); background: var(--post-bg); }
  .phase-n  { font-size: 9px; font-weight: 600; color: var(--txt3); margin-bottom: 3px; letter-spacing: .05em; }
  .phase-lbl{ font-size: 11px; font-weight: 500; color: var(--txt2); margin-bottom: 3px; }
  .phase-sum{ font-family: var(--mono); font-size: 10px; color: var(--txt3); }
  .cur-badge {
    position: absolute; top: 5px; right: 5px;
    font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
    background: var(--get); color: #0f1117;
  }
  .phase-arr { font-size: 16px; color: var(--txt3); flex-shrink: 0; align-self: center; }

  /* DETAIL BOX */
  .detail-box {
    padding: 14px 16px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--bg3); margin-bottom: 10px; transition: all .3s; min-height: 100px;
  }
  .detail-lbl { font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--txt3); }
  .detail-txt { font-size: 13px; line-height: 1.8; white-space: pre-line; color: var(--txt2); }

  /* CONTROLS */
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .controls button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg3); color: var(--txt2); font-size: 12.5px; cursor: pointer;
    font-family: var(--sans); transition: all .15s;
  }
  .controls button:hover:not(:disabled) { border-color: var(--txt3); color: var(--txt); }
  .controls button:disabled { opacity: .3; cursor: default; }
  .controls button.primary { background: var(--get-bg); border-color: var(--get-bd); color: var(--get); font-weight: 500; min-width: 110px; }
  .spd { font-size: 11px !important; padding: 4px 10px !important; }
  .spd.on { border-color: var(--txt2) !important; color: var(--txt) !important; }

  /* RECAP BAR */
  .recap {
    display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 10px 14px;
    background: rgba(249,226,175,.06); border: 1px solid var(--put-bd);
    border-radius: 8px; margin-top: 12px; font-size: 12px; color: var(--put);
    font-family: var(--mono);
  }

  @keyframes gloPulse {
    0%,100% { box-shadow: none; }
    55%      { box-shadow: 0 0 0 3px var(--get); }
  }
  .cur { animation: gloPulse .9s ease infinite; }
</style>
</head>
<body>

<header>
  <div class="logo">🌡️</div>
  <div>
    <h1>API REST — Express &amp; MySQL</h1>
    <p>BTS CIEL — Lycée Newton-ENREA · Serveur Node.js :3000 · Base METEO</p>
  </div>
</header>

<div class="card">
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</div>

<script>
var CLR = {
  GET:    {tx:'var(--get)',    bg:'var(--get-bg)',    bd:'var(--get-bd)'},
  POST:   {tx:'var(--post)',   bg:'var(--post-bg)',   bd:'var(--post-bd)'},
  PUT:    {tx:'var(--put)',    bg:'var(--put-bg)',     bd:'var(--put-bd)'},
  DELETE: {tx:'var(--delete)', bg:'var(--delete-bg)', bd:'var(--delete-bd)'}
};

var TABS = ['Architecture','Objet req','GET','POST','PUT','DELETE'];

var OV = {
  GET:    {url:'/temperature',     xtr:'?ID=...',   sql:'SELECT * FROM TEMPERATURE [WHERE ID=?]', dsc:'Lire les mesures',    app:"app.get('/temperature', handler)"},
  POST:   {url:'/temperature',     xtr:'Body JSON', sql:'INSERT INTO TEMPERATURE(TEMP) VALUES(?)',dsc:'Ajouter une mesure',  app:"app.post('/temperature', handler)"},
  PUT:    {url:'/temperature/:ID', xtr:'Body JSON', sql:'UPDATE TEMPERATURE SET TEMP=? WHERE id=?',dsc:'Modifier une mesure',app:"app.put('/temperature/:ID', handler)"},
  DELETE: {url:'/temperature/:ID', xtr:'',          sql:'DELETE FROM TEMPERATURE WHERE id=?',     dsc:'Supprimer une mesure',app:"app.delete('/temperature/:ID', handler)"}
};

var RP = [
  {name:'req.method', icon:'🔵', ex:'GET | POST | PUT | DELETE',
   dsc:'La méthode HTTP utilisée. Express route vers app.get(), app.post(), etc.\nValeur de type String.', val:"'GET'"},
  {name:'req.url',    icon:'🔗', ex:'/temperature?ID=5',
   dsc:"L'URL complète demandée (chemin + query string inclus).", val:"'/temperature?ID=5'"},
  {name:'req.query',  icon:'❓', ex:'/temperature?ID=5  →  { ID:"5" }',
   dsc:'Paramètres après le ? dans l\'URL.\nToujours des String ! ?ID=5 → req.query.ID = "5" (pas le nombre 5).', val:"{ ID: '5' }"},
  {name:'req.params', icon:'🔑', ex:'/temperature/12  →  { ID:"12" }',
   dsc:'Segments dynamiques :ID de l\'URL.\nToujours des String ! Route :ID + /temperature/12 → req.params.ID = "12".', val:"{ ID: '12' }"},
  {name:'req.body',   icon:'📦', ex:'POST {"TEMP":23}  →  { TEMP:23 }',
   dsc:'Corps JSON de la requête, parsé par bodyParser.json().\n⚠ Sans ce middleware → req.body vaut undefined !', val:'{ TEMP: 23 }'}
];

var PH = {
  GET: [
    {icon:'💻', lbl:'Requête HTTP',    sum:'GET /temperature?ID=5',
     det:'Le client envoie une requête GET.\n? = début des query parameters. ?ID=5 filtre par ID.\nAucun body n\'est envoyé dans un GET.\nURL complète : http://localhost:3000/temperature?ID=5',
     code:'GET /temperature?ID=5 HTTP/1.1\nHost: localhost:3000\n\n(aucun body dans un GET)'},
    {icon:'⚙️', lbl:'Handler Express', sum:"req.query.ID = '5'",
     det:'Express route vers app.get(\'/temperature\').\nbodyParser.json() ne fait rien (pas de body).\nExpress extrait les query params automatiquement :\n  req.query       = { ID: \'5\' }  ← objet\n  req.query.ID    = \'5\'          ← toujours String !\n  req.params      = {}            ← pas de :ID dans la route\n  req.body        = undefined',
     code:"app.get('/temperature', (req, res) => {\n  let sql = 'SELECT * FROM TEMPERATURE';\n  if (req.query.ID) {\n    sql += ' WHERE ID=' + req.query.ID + ' LIMIT 1';\n  }\n  conn.query(sql, (err, results) => {\n    res.send(results); // tableau JSON\n  });\n});"},
    {icon:'🗄️', lbl:'SQL → MySQL',    sum:'SELECT … WHERE ID=5',
     det:'Le handler construit le SQL dynamiquement.\nComme req.query.ID = "5", la clause WHERE est ajoutée.\nconn.query() envoie la requête à MySQL (base METEO).',
     code:"-- SQL généré (avec ?ID=5) :\nSELECT * FROM TEMPERATURE\n  WHERE ID = 5 LIMIT 1\n\n-- Sans ?ID : SELECT * FROM TEMPERATURE"},
    {icon:'📥', lbl:'Réponse JSON',   sum:'200 OK → [{id:5,…}]',
     det:'MySQL retourne les résultats au callback.\nres.send(results) sérialise le tableau en JSON.\nHTTP 200 OK est envoyé automatiquement par Express.',
     code:'HTTP/1.1 200 OK\nContent-Type: application/json\n\n[{"id":5,"TEMP":"22°C"}]'}
  ],
  POST: [
    {icon:'💻', lbl:'Requête HTTP',    sum:'POST + body {"TEMP":23}',
     det:'Le client envoie une requête POST avec un corps JSON.\nLe header Content-Type: application/json est obligatoire\npour que bodyParser.json() parse correctement le body.\nSans ce header → req.body vaut undefined !',
     code:'POST /temperature HTTP/1.1\nHost: localhost:3000\nContent-Type: application/json\n\n{"TEMP": 23}'},
    {icon:'⚙️', lbl:'Handler Express', sum:'req.body.TEMP = 23',
     det:'Express route vers app.post(\'/temperature\').\nbodyParser.json() parse le body :\n  req.body        = { TEMP: 23 }  ← objet\n  req.body.TEMP   = 23            ← Number (pas String)\n  req.query       = {}\n  req.params      = {}',
     code:"app.post('/temperature', (req, res) => {\n  var newTemp = req.body.TEMP;  // 23\n  var sql = 'INSERT INTO TEMPERATURE(TEMP) VALUES(?)';\n  conn.query(sql, [newTemp], (err, result) => {\n    res.send({ status: 1, message: 'Mesure ajoutee' });\n  });\n});"},
    {icon:'🗄️', lbl:'SQL → MySQL',    sum:'INSERT … VALUES(23)',
     det:'conn.query() exécute l\'INSERT avec la valeur de req.body.TEMP.\nMySQL assigne automatiquement un ID auto-increment.',
     code:"-- SQL généré :\nINSERT INTO TEMPERATURE(TEMP)\n  VALUES(23)\n\n-- MySQL attribue automatiquement l'ID (auto_increment)"},
    {icon:'📥', lbl:'Réponse JSON',   sum:'200 OK → {status:1}',
     det:'MySQL confirme l\'INSERT. res.send() renvoie un JSON.\nNote REST : on pourrait renvoyer 201 Created plutôt que 200.',
     code:'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"status":1,"message":"Mesure ajoutee"}'}
  ],
  PUT: [
    {icon:'💻', lbl:'Requête HTTP',    sum:'PUT /temperature/12 + body',
     det:'Le client envoie PUT avec l\'ID dans l\'URL ET le body JSON.\n  URL  : /temperature/12  → l\'ID 12 est dans le chemin\n  Body : {"TEMP": 25}    → la nouvelle valeur\nContent-Type: application/json est obligatoire.',
     code:'PUT /temperature/12 HTTP/1.1\nHost: localhost:3000\nContent-Type: application/json\n\n{"TEMP": 25}'},
    {icon:'⚙️', lbl:'Handler Express', sum:"params.ID='12' + body.TEMP=25",
     det:'Express route vers app.put(\'/temperature/:ID\').\n:ID capture le segment de l\'URL (12).\nbodyParser.json() parse le body :\n  req.params.ID   = \'12\'  ← String, depuis l\'URL\n  req.body.TEMP   = 25    ← Number, depuis le JSON\n  req.query       = {}',
     code:"app.put('/temperature/:ID', (req, res) => {\n  var id      = req.params.ID;  // '12' (URL)\n  var newTemp = req.body.TEMP;  //  25  (JSON)\n  var sql = 'UPDATE TEMPERATURE SET TEMP=? WHERE id=?';\n  conn.query(sql, [newTemp, id], (err) => {\n    res.send({ status:1, message:'Mesure mise a jour' });\n  });\n});"},
    {icon:'🗄️', lbl:'SQL → MySQL',    sum:'UPDATE … WHERE id=12',
     det:'conn.query() exécute l\'UPDATE ciblé sur id=12.\nLes ? protègent contre les injections SQL.\nMySQL met à jour la colonne TEMP.',
     code:"-- SQL généré :\nUPDATE TEMPERATURE\n  SET TEMP = 25\n  WHERE id = 12\n\n-- Protection injection : valeurs passées en paramètres"},
    {icon:'📥', lbl:'Réponse JSON',   sum:'200 OK → {status:1}',
     det:'MySQL confirme. res.send() renvoie le JSON de confirmation.\nSi id=12 n\'existait pas → affectedRows=0 (à gérer).',
     code:'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"status":1,"message":"Mesure mise a jour"}'}
  ],
  DELETE: [
    {icon:'💻', lbl:'Requête HTTP',    sum:'DELETE /temperature/12',
     det:'Le client envoie DELETE avec l\'ID dans l\'URL.\nAucun body nécessaire : l\'ID dans l\'URL suffit.\nC\'est la méthode HTTP la plus simple côté client.',
     code:'DELETE /temperature/12 HTTP/1.1\nHost: localhost:3000\n\n(aucun body requis pour un DELETE)'},
    {icon:'⚙️', lbl:'Handler Express', sum:"req.params.ID = '12'",
     det:'Express route vers app.delete(\'/temperature/:ID\').\n:ID capture le segment de l\'URL.\nbodyParser.json() ne fait rien (pas de body) :\n  req.params.ID   = \'12\'  ← String, depuis l\'URL\n  req.body        = undefined\n  req.query       = {}',
     code:"app.delete('/temperature/:ID', (req, res) => {\n  var id  = req.params.ID;  // '12'\n  var sql = 'DELETE FROM TEMPERATURE WHERE id = ?';\n  conn.query(sql, [id], (err) => {\n    res.send({ status:1, message:'Mesure supprimee' });\n  });\n});"},
    {icon:'🗄️', lbl:'SQL → MySQL',    sum:'DELETE … WHERE id=12',
     det:'conn.query() exécute le DELETE ciblé sur id=12.\nMySQL supprime la ligne et retourne affectedRows=1.',
     code:"-- SQL généré :\nDELETE FROM TEMPERATURE\n  WHERE id = 12\n\n-- Table après DELETE :\n-- id=1 TEMP=25°C  (la ligne id=12 est supprimée !)"},
    {icon:'📥', lbl:'Réponse JSON',   sum:'200 OK → {status:1}',
     det:'MySQL confirme la suppression. res.send() renvoie le JSON.\nNote REST : 204 No Content (sans body) serait plus standard.',
     code:'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"status":1,"message":"Mesure supprimee"}'}
  ]
};

var DESCS = [
  'Architecture 3-tiers : le Client HTTP envoie la requête, Express la route vers le bon handler qui exécute le SQL sur MySQL METEO et renvoie le JSON. Sélectionnez une méthode pour voir son flux complet.',
  'Express expose toutes les données de la requête dans l\'objet req. Cliquez sur chaque propriété pour voir son rôle, son exemple et la valeur extraite.',
  'La route GET interroge la table TEMPERATURE. Sans ?ID : SELECT * retourne tout. Avec ?ID=5 : req.query.ID filtre le résultat. Suivez les 4 phases pas à pas.',
  'La route POST reçoit la nouvelle valeur dans req.body.TEMP, parsé par bodyParser.json(). Elle exécute un INSERT et répond en JSON.',
  'La route PUT combine req.params.ID (depuis l\'URL /temperature/12) et req.body.TEMP (depuis le corps JSON). Elle exécute un UPDATE ciblé.',
  'La route DELETE n\'a besoin que de req.params.ID extrait de l\'URL. Aucun body requis. Elle exécute un DELETE ciblé.'
];

var MTH_FOR = [null, null, 'GET', 'POST', 'PUT', 'DELETE'];

var gTab = 0;
var gOvMth = 'GET';
var gRpIdx = 0;
var gStep  = -1;
var gRun   = false;
var gSpd   = 900;
var gTmr   = null;

/* ---- BADGE HTML ---- */
function bdgH(m) {
  return '<span class="badge '+m+'">'+m+'</span>';
}

/* ===================== RENDER OV ===================== */
function renderOv() {
  var m = OV[gOvMth]; var c = CLR[gOvMth];
  var h = '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">';
  ['GET','POST','PUT','DELETE'].forEach(function(k) {
    h += '<span class="badge '+k+(gOvMth===k?' sel':'')+'" onclick="ovSel(\''+k+'\')">'+k+'</span>';
  });
  h += '</div><div class="arch">';
  // Client
  h += '<div class="arch-box" style="border-color:'+c.bd+';background:'+c.bg+'">';
  h += '<div class="arch-lbl" style="color:'+c.tx+'">💻 CLIENT HTTP</div>';
  h += bdgH(gOvMth);
  h += '<div style="font-family:var(--mono);font-size:12px;color:'+c.tx+';margin-top:6px">localhost:3000'+m.url+'</div>';
  if (m.xtr) h += '<div style="font-family:var(--mono);font-size:11px;color:'+c.tx+';opacity:.65;margin-top:2px">'+m.xtr+'</div>';
  h += '</div>';
  h += '<div class="arch-arrow" style="color:'+c.tx+'">→</div>';
  // Express
  h += '<div class="arch-box" style="border-color:'+c.bd+';flex:1.6">';
  h += '<div class="arch-lbl">⚙️ SERVEUR NODE.JS / EXPRESS</div>';
  h += '<div class="cb" style="margin-bottom:8px;font-size:11px">app.use(bodyParser.json()) // middleware</div>';
  h += '<div style="font-family:var(--mono);font-size:12.5px;color:'+c.tx+';font-weight:500">'+m.app+'</div>';
  h += '<div style="font-size:12px;color:var(--txt2);margin-top:5px">'+m.dsc+'</div>';
  h += '<div style="font-family:var(--mono);font-size:11px;color:'+c.tx+';margin-top:8px;opacity:.8">conn.query(sql) → résultats</div>';
  h += '</div>';
  h += '<div class="arch-arrow" style="color:'+c.tx+'">→</div>';
  // MySQL
  h += '<div class="arch-box" style="border-color:'+c.bd+'">';
  h += '<div class="arch-lbl">🗄️ MySQL — DATABASE METEO</div>';
  h += '<div class="cb" style="font-size:11px;color:'+c.tx+';margin-bottom:8px">'+m.sql+'</div>';
  h += '<table class="db-tbl"><thead><tr><th>id</th><th>TEMP</th></tr></thead><tbody>';
  h += '<tr><td>1</td><td>25°C</td></tr><tr><td>12</td><td>18°C</td></tr>';
  h += '</tbody></table></div></div>';
  h += '<div style="text-align:center;font-family:var(--mono);font-size:11px;color:var(--txt3);margin-top:10px">app.listen(3000) → Le serveur écoute sur le port 3000</div>';
  return h;
}

/* ===================== RENDER RP ===================== */
function renderRp() {
  var h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start">';
  h += '<div>';
  RP.forEach(function(p, i) {
    h += '<div class="rp-row'+(gRpIdx===i?' sel':'')+'" onclick="rpSel('+i+')">';
    h += '<span style="font-size:15px;flex-shrink:0">'+p.icon+'</span>';
    h += '<div><div style="font-family:var(--mono);font-size:13px;font-weight:500;color:var(--txt)">'+p.name+'</div>';
    h += '<div style="font-size:11px;color:var(--txt3);margin-top:2px">'+p.ex+'</div></div></div>';
  });
  h += '</div>';
  var rp = RP[gRpIdx];
  h += '<div style="background:var(--bg3);border:1px solid var(--get-bd);border-radius:9px;padding:14px">';
  h += '<div style="font-family:var(--mono);font-size:14px;font-weight:500;color:var(--get);margin-bottom:8px">'+rp.name+'</div>';
  h += '<div style="font-size:13px;color:var(--txt2);white-space:pre-line;line-height:1.75;margin-bottom:12px">'+rp.dsc+'</div>';
  h += '<div style="font-size:11px;color:var(--txt3);margin-bottom:4px">Valeur extraite :</div>';
  h += '<div class="cb">'+rp.name+' <span style="color:var(--txt3)">→</span> <span style="color:var(--get)">'+rp.val+'</span></div>';
  h += '</div></div>';
  h += '<div class="recap">';
  ['req → ce que le client envoie','res → ce que le serveur renvoie','req.query → paramètres ?','req.params → :ID dans l\'URL','req.body → JSON (POST/PUT)'].forEach(function(t){h+='<span>'+t+'</span>';});
  h += '</div>';
  return h;
}

/* ===================== RENDER METHOD ===================== */
function renderMethod(mth) {
  var h = '<div class="phase-strip">';
  for (var i=0; i<4; i++) {
    h += '<div id="pb'+i+'" class="phase-box">';
    h += '<div id="pbadge'+i+'" class="cur-badge" style="display:none">EN COURS</div>';
    h += '<div class="phase-n">PHASE '+(i+1)+'/4</div>';
    h += '<div class="phase-lbl">'+PH[mth][i].icon+' '+PH[mth][i].lbl+'</div>';
    h += '<div class="phase-sum">'+PH[mth][i].sum+'</div>';
    h += '<div id="pchk'+i+'" style="position:absolute;top:5px;left:8px;font-size:11px;color:var(--post)"></div>';
    h += '</div>';
    if (i<3) h += '<div id="parr'+i+'" class="phase-arr">→</div>';
  }
  h += '</div>';
  h += '<div id="detbox" class="detail-box">';
  h += '<div id="detlbl" class="detail-lbl">Appuyez sur ▶ Démarrer pour lancer la simulation pas à pas.</div>';
  h += '<div id="dettxt" class="detail-txt"></div>';
  h += '</div>';
  h += '<div id="codebox" style="display:none;margin-bottom:10px">';
  h += '<div id="codelbl" style="font-size:11px;color:var(--txt3);margin-bottom:4px"></div>';
  h += '<div id="codepre" class="cb" style="font-size:12px"></div>';
  h += '</div>';
  h += '<div class="controls">';
  h += '<button onclick="sReset()" title="Réinitialiser">⏮</button>';
  h += '<button id="bprev" onclick="sManual(-1)" disabled>◀ Préc</button>';
  h += '<button id="bplay" class="primary" onclick="sToggle()">▶ Démarrer</button>';
  h += '<button id="bnext" onclick="sManual(1)">Suiv ▶</button>';
  h += '<span style="flex:1"></span>';
  h += '<span style="font-size:11px;color:var(--txt3)">Vitesse :</span>';
  h += '<button class="spd'+(gSpd===1600?' on':'')+'" onclick="sSpeed(1600)">Lent</button>';
  h += '<button class="spd'+(gSpd===900?' on':'')+'" onclick="sSpeed(900)">Normal</button>';
  h += '<button class="spd'+(gSpd===400?' on':'')+'" onclick="sSpeed(400)">Rapide</button>';
  h += '</div>';
  return h;
}

/* ===================== SIM UPDATE ===================== */
function sUpdate() {
  var mth = MTH_FOR[gTab];
  if (!mth) return;
  var ph = PH[mth]; var c = CLR[mth];
  for (var i=0; i<4; i++) {
    var box = document.getElementById('pb'+i);
    if (!box) return;
    var badge = document.getElementById('pbadge'+i);
    var chk   = document.getElementById('pchk'+i);
    var arr   = i<3 ? document.getElementById('parr'+i) : null;
    if (gStep === i) {
      box.style.borderColor = c.bd; box.style.background = c.bg;
      box.classList.add('cur'); box.classList.remove('done');
      if (badge) badge.style.display = 'block';
      if (chk)   chk.textContent = '';
    } else if (gStep > i) {
      box.style.borderColor = 'var(--post-bd)'; box.style.background = 'var(--post-bg)';
      box.classList.remove('cur'); box.classList.add('done');
      if (badge) badge.style.display = 'none';
      if (chk)   chk.textContent = '✓';
    } else {
      box.style.borderColor = 'var(--border)'; box.style.background = 'var(--bg3)';
      box.classList.remove('cur','done');
      if (badge) badge.style.display = 'none';
      if (chk)   chk.textContent = '';
    }
    if (arr) arr.style.color = gStep > i ? c.tx : 'var(--txt3)';
  }
  var detbox = document.getElementById('detbox');
  var detlbl = document.getElementById('detlbl');
  var dettxt = document.getElementById('dettxt');
  if (!detbox) return;
  if (gStep < 0) {
    detbox.style.borderColor = 'var(--border)'; detbox.style.background = 'var(--bg3)';
    detlbl.style.color = 'var(--txt3)';
    detlbl.textContent = 'Appuyez sur ▶ Démarrer pour lancer la simulation pas à pas.';
    dettxt.textContent = '';
  } else {
    detbox.style.borderColor = c.bd; detbox.style.background = c.bg;
    detlbl.style.color = c.tx;
    detlbl.textContent = 'Phase '+(gStep+1)+'/4 — '+ph[gStep].icon+' '+ph[gStep].lbl;
    dettxt.style.color = c.tx;
    dettxt.textContent = ph[gStep].det;
  }
  var codebox = document.getElementById('codebox');
  var codelbl = document.getElementById('codelbl');
  var codepre = document.getElementById('codepre');
  if (codebox && codelbl && codepre) {
    if (gStep >= 0) {
      codebox.style.display = 'block';
      codelbl.textContent = 'Code — phase '+(gStep+1)+' : '+ph[gStep].lbl;
      codepre.textContent = ph[gStep].code;
    } else {
      codebox.style.display = 'none';
    }
  }
  var bp = document.getElementById('bplay');
  if (bp) bp.textContent = gRun ? '⏸ Pause' : (gStep>=0 ? '▶ Reprendre' : '▶ Démarrer');
  var bprev = document.getElementById('bprev');
  if (bprev) bprev.disabled = gStep < 0;
  var bnext = document.getElementById('bnext');
  if (bnext) bnext.disabled = gStep >= 3;
  document.querySelectorAll('.spd').forEach(function(b) {
    b.classList.toggle('on', parseInt(b.textContent==='Lent'?1600:b.textContent==='Rapide'?400:900) === gSpd);
  });
}

function sTick() {
  if (gStep < 3) {
    gStep++;
    sUpdate();
    if (gStep >= 3) { clearInterval(gTmr); gTmr=null; gRun=false; sUpdate(); }
  }
}

window.sToggle = function() {
  if (gRun) { clearInterval(gTmr); gTmr=null; gRun=false; sUpdate(); }
  else {
    if (gStep >= 3) gStep = -1;
    if (gStep < 0) gStep = 0; else { gStep++; if(gStep>3) gStep=0; }
    gRun = true; sUpdate();
    gTmr = setInterval(sTick, gSpd);
  }
};
window.sManual = function(d) {
  clearInterval(gTmr); gTmr=null; gRun=false;
  gStep = Math.max(-1, Math.min(3, gStep+d));
  sUpdate();
};
window.sReset = function() {
  clearInterval(gTmr); gTmr=null; gRun=false; gStep=-1; sUpdate();
};
window.sSpeed = function(ms) {
  gSpd = ms;
  if (gRun) { clearInterval(gTmr); gTmr=null; gTmr=setInterval(sTick,ms); }
  document.querySelectorAll('.spd').forEach(function(b){
    var v = b.textContent==='Lent'?1600:b.textContent==='Rapide'?400:900;
    b.classList.toggle('on', v===ms);
  });
};
window.ovSel = function(k) { gOvMth=k; document.getElementById('content').innerHTML = renderOv()+descH(); };
window.rpSel = function(i) { gRpIdx=i; document.getElementById('content').innerHTML = renderRp()+descH(); };

function descH() {
  return '<div class="desc-box">'+DESCS[gTab]+'</div>';
}

/* ===================== TAB SWITCH ===================== */
function switchTab(i) {
  clearInterval(gTmr); gTmr=null; gRun=false; gStep=-1;
  gTab = i;
  document.querySelectorAll('.tab').forEach(function(t,j){ t.classList.toggle('on',j===i); });
  var mth = MTH_FOR[i];
  var c   = document.getElementById('content');
  if (i===0) c.innerHTML = renderOv() + descH();
  else if (i===1) c.innerHTML = renderRp() + descH();
  else { c.innerHTML = renderMethod(mth) + descH(); sUpdate(); }
}

/* ===================== INIT ===================== */
var tabsEl = document.getElementById('tabs');
TABS.forEach(function(name, i) {
  var b = document.createElement('button');
  b.className = 'tab' + (i===0?' on':'');
  b.textContent = name;
  b.onclick = function() { switchTab(i); };
  tabsEl.appendChild(b);
});
switchTab(0);
</script>
</body>
</html>
