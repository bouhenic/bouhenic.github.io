/* ── Résout l'explication à afficher selon step + phase ──────────── */
function resolveExplanation(stepIdx, phase, hostkeyResult) {
  if (phase === "idle")    return EXPLANATIONS.idle;
  if (phase === "hostkey") return EXPLANATIONS.hostkey;
  if (phase === "done")    return hostkeyResult === "ok" ? EXPLANATIONS.done_ok : EXPLANATIONS.done_blocked;
  if (stepIdx >= 0 && stepIdx < SSH_STEPS.length)
    return EXPLANATIONS[SSH_STEPS[stepIdx].id] || EXPLANATIONS.idle;
  return EXPLANATIONS.idle;
}

/* ── Event builder ───────────────────────────────────────────────── */
const STEP_MS = 850;

function buildEvents(scenario) {
  const evs = [];
  for (let i = 0; i <= 8; i++)
    evs.push({ t: i * STEP_MS, type:"step", value:i });

  const T_HK   = 8 * STEP_MS + 150;
  const T_TERM = T_HK + 900;
  evs.push({ t: T_HK,   type:"phase", value:"hostkey"  });
  evs.push({ t: T_TERM, type:"phase", value:"terminal" });

  scenario.terminalLines.forEach(line => {
    evs.push({ t: T_TERM + line.t, type:"termLine", value:line });
    if (line.updatesKnownHosts)
      evs.push({ t: T_TERM + line.t + 300, type:"updateKnownHosts" });
  });

  const T_LAST = T_TERM + Math.max(...scenario.terminalLines.map(l => l.t));

  if (scenario.result === "ok") {
    const T_RESUME = T_LAST + 1100;
    evs.push({ t: T_RESUME, type:"phase", value:"arrows" });
    for (let i = 9; i < SSH_STEPS.length; i++)
      evs.push({ t: T_RESUME + (i-9)*STEP_MS, type:"step", value:i });
    evs.push({ t: T_RESUME + (SSH_STEPS.length-9)*STEP_MS, type:"phase", value:"done" });
  } else {
    evs.push({ t: T_LAST + 900, type:"phase", value:"done" });
  }

  const duration = Math.max(...evs.map(e => e.t)) + 400;
  return { evs: evs.sort((a,b) => a.t - b.t), duration };
}

/* ── Composant : panneau d'explication ───────────────────────────── */
function ExplanationPanel({ explanation, paused }) {
  const [key, setKey] = useState(0);
  const prevTitle = useRef(null);

  useEffect(() => {
    if (explanation.title !== prevTitle.current) {
      prevTitle.current = explanation.title;
      setKey(k => k + 1);
    }
  }, [explanation.title]);

  return (
    <div style={{
      background: C.panel,
      border: `1px solid ${explanation.color}44`,
      borderRadius: 10,
      padding: 14,
      boxShadow: `0 0 24px ${explanation.color}18`,
      position: "relative",
      overflow: "hidden",
    }}>
      {/* Barre colorée gauche */}
      <div style={{
        position:"absolute", left:0, top:0, bottom:0, width:3,
        background:`linear-gradient(to bottom, ${explanation.color}, ${explanation.color}33)`,
        borderRadius:"10px 0 0 10px",
      }}/>

      <div key={key} className="explanation-enter" style={{paddingLeft:8}}>
        {/* Phase badge */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:14}}>{explanation.icon}</span>
          <span style={{color:explanation.color,fontSize:9,letterSpacing:2,
            background:`${explanation.color}18`,padding:"2px 8px",borderRadius:10,
            border:`1px solid ${explanation.color}44`}}>
            {explanation.phase}
          </span>
          {paused && (
            <span style={{color:C.yellow,fontSize:9,letterSpacing:1,marginLeft:"auto",
              opacity:0.7}}>⏸ en pause</span>
          )}
        </div>

        {/* Titre */}
        <div style={{color:C.bright,fontSize:13,fontWeight:"bold",marginBottom:8,lineHeight:1.3}}>
          {explanation.title}
        </div>

        {/* Corps */}
        <div style={{color:C.text,fontSize:11,lineHeight:1.8,marginBottom:explanation.detail?10:0}}>
          {explanation.body}
        </div>

        {/* Détails techniques */}
        {explanation.detail && (
          <div style={{
            background:"#030608", border:`1px solid ${C.dim}`,
            borderRadius:6, padding:"8px 10px",
            display:"flex", flexDirection:"column", gap:4,
          }}>
            {Object.entries(explanation.detail).map(([k,v]) => (
              <div key={k} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <span style={{color:C.muted,fontSize:9,minWidth:130,flexShrink:0,paddingTop:1}}>{k}</span>
                <span style={{color:explanation.color,fontSize:9.5,fontFamily:"monospace",
                  wordBreak:"break-all",lineHeight:1.5}}>{v}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Autres composants ───────────────────────────────────────────── */
function ArrowRow({ step, active, done, blocked }) {
  const opacity = blocked ? 0.07 : done || active ? 1 : 0.2;
  const color   = done || active ? step.color : C.dim;
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,opacity,transition:"opacity 0.35s",padding:"2px 0"}}>
      <div style={{width:7,height:7,borderRadius:"50%",background:step.dir==="→"?color:C.dim,flexShrink:0}}/>
      <div style={{flex:1,position:"relative",height:20}}>
        <div style={{position:"absolute",top:"50%",left:0,right:0,height:1,
          background:`linear-gradient(${step.dir==="→"?"to right":"to left"},${color}cc,${color}22)`,
          transform:"translateY(-50%)"}}/>
        <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",
          background:C.panel,padding:"1px 8px",borderRadius:3,color,
          fontFamily:"monospace",fontSize:9.5,whiteSpace:"nowrap",
          fontWeight:active?"bold":"normal",
          border:active?`1px solid ${color}55`:"none",
          boxShadow:active?`0 0 10px ${color}44`:"none"}}>
          {step.label}
        </div>
      </div>
      <div style={{width:7,height:7,borderRadius:"50%",background:step.dir==="←"?color:C.dim,flexShrink:0}}/>
    </div>
  );
}

function KnownHostsFile({ title, entries, highlight, hlColor }) {
  return (
    <div style={{flex:1}}>
      <div style={{color:C.muted,fontSize:9,letterSpacing:2,marginBottom:6}}>{title}</div>
      <div style={{background:"#030608",border:`1px solid ${C.border}`,borderRadius:6,
        padding:"8px 12px",fontFamily:"monospace",fontSize:9.5,lineHeight:1.7,minHeight:52}}>
        <div style={{color:C.muted,marginBottom:4,fontSize:9}}>~/.ssh/known_hosts</div>
        {entries.length===0
          ? <div style={{color:C.dim,fontStyle:"italic"}}>(fichier vide)</div>
          : entries.map((e,i)=>(
            <div key={i} style={{color:highlight?hlColor:C.text,wordBreak:"break-all",
              background:highlight?`${hlColor}11`:"transparent",padding:"1px 4px",borderRadius:2,
              borderLeft:highlight?`2px solid ${hlColor}`:`2px solid transparent`}}>{e}</div>
          ))
        }
      </div>
    </div>
  );
}

function FingerprintBox({ scenario }) {
  const r = scenario.result, has = scenario.knownHosts.length > 0;
  const sc = r==="blocked"?C.red:!has?C.yellow:C.green;
  const st = r==="blocked"?"✗  EMPREINTE DIFFÉRENTE — Possible attaque MITM !"
           : !has?"⚠  Clé inconnue — demander confirmation à l'utilisateur"
           : "✓  Empreintes identiques — serveur authentifié";
  return (
    <div style={{background:C.panel,border:`1px solid ${scenario.accent}55`,borderRadius:10,
      padding:12,boxShadow:`0 0 20px ${scenario.accent}18`}}>
      <div style={{color:scenario.accent,fontSize:9,letterSpacing:2,marginBottom:8}}>
        🔍 VÉRIFICATION FINGERPRINT
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{color:C.muted,fontSize:9,minWidth:110,flexShrink:0}}>Clé reçue (serveur)</span>
          <span style={{color:r==="blocked"?C.red:C.blue,fontSize:9.5,wordBreak:"break-all",fontFamily:"monospace"}}>{scenario.serverKey}</span>
        </div>
        {has && (
          <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
            <span style={{color:C.muted,fontSize:9,minWidth:110,flexShrink:0}}>known_hosts (ligne 1)</span>
            <span style={{color:r==="ok"?C.green:C.orange,fontSize:9.5,wordBreak:"break-all",fontFamily:"monospace"}}>
              SHA256:abc123XyZ9mNpQrStUvWx0123456789ABCDEF+abc=
            </span>
          </div>
        )}
        <div style={{padding:"5px 10px",borderRadius:6,background:`${sc}15`,
          border:`1px solid ${sc}55`,color:sc,fontSize:9.5,letterSpacing:1,fontWeight:"bold"}}>
          {st}
        </div>
      </div>
    </div>
  );
}

function Terminal({ lines, accent }) {
  const endRef = useRef(null);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[lines]);
  return (
    <div style={{background:"#020406",border:`1px solid ${accent}33`,borderRadius:8,
      overflow:"hidden",boxShadow:`0 0 24px ${accent}18`,display:"flex",flexDirection:"column"}}>
      <div style={{background:"#0a0f18",padding:"5px 12px",borderBottom:`1px solid ${C.border}`,
        display:"flex",alignItems:"center",gap:6}}>
        {["#ff5f57","#febc2e","#28c840"].map((c,i)=>(
          <div key={i} style={{width:9,height:9,borderRadius:"50%",background:c}}/>
        ))}
        <span style={{color:C.muted,fontFamily:"monospace",fontSize:9.5,marginLeft:8}}>
          alice@client — ssh 192.168.1.1
        </span>
      </div>
      <div style={{padding:"10px 14px",overflowY:"auto",fontFamily:"'Courier New',monospace",
        fontSize:11.5,lineHeight:1.7,minHeight:160,maxHeight:220}}>
        {lines.map((line,i)=>(
          <div key={i} style={{color:line.color||C.text,fontWeight:line.bold?"bold":"normal",
            whiteSpace:"pre-wrap",wordBreak:"break-all",
            background:line.bold&&line.color===C.red?"#ff000015":"transparent",
            padding:line.bold?"1px 4px":0}}>{line.text}</div>
        ))}
        <div ref={endRef}/>
      </div>
    </div>
  );
}

function ProgressBar({ elapsed, duration, accent, paused }) {
  const pct = Math.min(100,(elapsed/duration)*100).toFixed(2);
  return (
    <div style={{width:"100%",height:3,background:C.dim,borderRadius:2,overflow:"hidden",
      opacity:paused?0.45:1,transition:"opacity 0.3s"}}>
      <div style={{height:"100%",width:`${pct}%`,
        background:`linear-gradient(to right,${accent}77,${accent})`,
        borderRadius:2,transition:"width 0.08s linear"}}/>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────────────── */
function App() {
  const [scenarioId,        setScenarioId]        = useState("first");
  const [step,              setStep]              = useState(-1);
  const [phase,             setPhase]             = useState("idle");
  const [termLines,         setTermLines]         = useState([]);
  const [knownHostsUpdated, setKnownHostsUpdated] = useState(false);
  const [paused,            setPaused]            = useState(false);
  const [elapsed,           setElapsed]           = useState(0);
  const [duration,          setDuration]          = useState(1);
  const [speed,             setSpeed]             = useState(1);

  const rafRef     = useRef(null);
  const elapsedRef = useRef(0);
  const lastTsRef  = useRef(null);
  const pausedRef  = useRef(false);
  const speedRef   = useRef(1);
  const eventsRef  = useRef([]);
  const firedRef   = useRef(new Set());
  const runningRef = useRef(false);

  const scenario      = SCENARIOS[scenarioId];
  const hostkeyResult = scenario.result;

  const fireEvent = useCallback((ev) => {
    if (ev.type==="step")             setStep(ev.value);
    if (ev.type==="phase")            setPhase(ev.value);
    if (ev.type==="termLine")         setTermLines(p=>[...p,ev.value]);
    if (ev.type==="updateKnownHosts") setKnownHostsUpdated(true);
  }, []);

  const tick = useCallback((ts) => {
    if (!runningRef.current) return;
    if (!pausedRef.current) {
      if (lastTsRef.current != null) elapsedRef.current += (ts - lastTsRef.current) * speedRef.current;
      lastTsRef.current = ts;
      eventsRef.current.forEach((ev,i) => {
        if (!firedRef.current.has(i) && elapsedRef.current >= ev.t) {
          firedRef.current.add(i); fireEvent(ev);
        }
      });
      setElapsed(Math.round(elapsedRef.current));
    } else {
      lastTsRef.current = null;
    }
    rafRef.current = requestAnimationFrame(tick);
  }, [fireEvent]);

  const start = useCallback(() => {
    cancelAnimationFrame(rafRef.current);
    runningRef.current = false;
    const sc = SCENARIOS[scenarioId];
    const { evs, duration:dur } = buildEvents(sc);
    eventsRef.current = evs; firedRef.current = new Set();
    elapsedRef.current = 0; lastTsRef.current = null; pausedRef.current = false;
    setStep(-1); setPhase("arrows"); setTermLines([]);
    setKnownHostsUpdated(false); setPaused(false); setElapsed(0); setDuration(dur);
    runningRef.current = true;
    rafRef.current = requestAnimationFrame(tick);
  }, [scenarioId, tick]);

  const togglePause = useCallback(() => {
    if (!runningRef.current) return;
    const next = !pausedRef.current;
    pausedRef.current = next;
    setPaused(next);
  }, []);

  const reset = useCallback(() => {
    cancelAnimationFrame(rafRef.current);
    runningRef.current = false; pausedRef.current = false;
    elapsedRef.current = 0; lastTsRef.current = null; firedRef.current = new Set();
    setStep(-1); setPhase("idle"); setTermLines([]);
    setKnownHostsUpdated(false); setPaused(false); setElapsed(0);
  }, []);

  useEffect(()=>{ reset(); }, [scenarioId]);
  useEffect(()=>()=>{ cancelAnimationFrame(rafRef.current); runningRef.current=false; }, []);

  // Résout le bon panel hostkey (après kex-reply)
  const displayPhase = phase === "terminal" || (phase === "arrows" && step > 8) ? "arrows" : phase;
  const explanation = resolveExplanation(step, phase==="terminal"?"arrows":phase, hostkeyResult);

  const isRunning   = phase !== "idle";
  const isDone      = phase === "done";
  const showFP      = ["hostkey","terminal","done"].includes(phase);
  const showTerm    = ["terminal","done"].includes(phase);
  const showKHafter = knownHostsUpdated || (isDone && scenarioId !== "first");

  return (
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",
      padding:"12px 16px",gap:10,boxSizing:"border-box"}}>

      {/* Header */}
      <div style={{textAlign:"center"}}>
        <div style={{color:C.cyan,fontSize:9,letterSpacing:7,marginBottom:2}}>BTS CIEL — CYBERSÉCURITÉ</div>
        <div style={{color:C.bright,fontSize:19,fontWeight:700,letterSpacing:2}}>SSH · Vérification known_hosts</div>
      </div>

      {/* Scénarios */}
      <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
        {Object.values(SCENARIOS).map(sc=>(
          <button key={sc.id} onClick={()=>setScenarioId(sc.id)} style={{
            background:scenarioId===sc.id?`${sc.accent}22`:C.panel,
            border:`1px solid ${scenarioId===sc.id?sc.accent:C.border}`,
            color:scenarioId===sc.id?sc.accent:C.muted,
            borderRadius:6,padding:"6px 16px",fontFamily:"monospace",fontSize:11,letterSpacing:1,
            boxShadow:scenarioId===sc.id?`0 0 12px ${sc.accent}33`:"none",
          }}>{sc.icon} {sc.label}</button>
        ))}
      </div>

      {/* Layout 3 colonnes */}
      <div style={{display:"flex",gap:10,flex:1,minHeight:0,flexWrap:"wrap"}}>

        {/* Colonne 1 : Flux SSH */}
        <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,
          padding:12,minWidth:240,flex:"0 0 auto",display:"flex",flexDirection:"column",gap:7}}>
          <div style={{color:C.muted,fontSize:9,letterSpacing:2}}>FLUX SSH — PORT 22</div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            {[{name:"CLIENT",ip:"192.168.1.10",color:C.cyan},{name:"SERVER",ip:"192.168.1.1",color:C.blue}].map(h=>(
              <div key={h.name} style={{textAlign:"center"}}>
                <div style={{border:`1px solid ${h.color}55`,borderRadius:6,padding:"4px 10px",
                  background:`${h.color}0a`,color:h.color,fontSize:9,letterSpacing:2}}>⬛ {h.name}</div>
                <div style={{color:C.muted,fontSize:8,marginTop:2}}>{h.ip}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            {SSH_STEPS.map((s,i)=>(
              <div key={s.id}>
                {s.hostkeyStep && (
                  <div style={{display:"flex",alignItems:"center",gap:5,margin:"4px 0",
                    opacity:step>=i?1:0.18,transition:"opacity 0.4s"}}>
                    <div style={{flex:1,height:1,background:C.dim}}/>
                    <div style={{fontSize:8,letterSpacing:1,padding:"2px 6px",
                      border:`1px solid ${scenario.accent}66`,borderRadius:10,
                      color:scenario.accent,background:`${scenario.accent}11`,whiteSpace:"nowrap"}}>
                      🔍 known_hosts ?
                    </div>
                    <div style={{flex:1,height:1,background:C.dim}}/>
                  </div>
                )}
                <ArrowRow step={s} active={step===i} done={step>i}
                  blocked={hostkeyResult==="blocked"&&s.requiresOk&&step>i}/>
              </div>
            ))}
            {isDone && (
              <div style={{textAlign:"center",marginTop:5,padding:"4px 0",borderRadius:4,
                border:`1px solid ${hostkeyResult==="ok"?C.green:C.red}44`,
                background:`${hostkeyResult==="ok"?C.green:C.red}08`,
                color:hostkeyResult==="ok"?C.green:C.red,fontSize:8.5,letterSpacing:2}}>
                {hostkeyResult==="ok"?"✓ SESSION ÉTABLIE":"✗ CONNEXION BLOQUÉE"}
              </div>
            )}
          </div>
        </div>

        {/* Colonne 2 : Explication */}
        <div style={{flex:"0 0 320px",display:"flex",flexDirection:"column",gap:10,minWidth:0}}>
          <ExplanationPanel explanation={explanation} paused={paused}/>
        </div>

        {/* Colonne 3 : known_hosts + fingerprint + terminal */}
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:10,minWidth:220}}>
          <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,
            padding:12,display:"flex",gap:10}}>
            <KnownHostsFile title="AVANT" entries={scenario.knownHosts} highlight={false}/>
            <div style={{width:1,background:C.border}}/>
            <KnownHostsFile title="APRÈS"
              entries={showKHafter?scenario.knownHostsAfter:scenario.knownHosts}
              highlight={showKHafter&&scenarioId==="first"} hlColor={C.green}/>
          </div>
          {showFP  && <FingerprintBox scenario={scenario}/>}
          {showTerm && <Terminal lines={termLines} accent={scenario.accent}/>}
          {phase==="idle" && (
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",
              background:C.panel,border:`1px dashed ${C.dim}`,borderRadius:10,
              color:C.muted,fontSize:10,letterSpacing:2,minHeight:120}}>
              ↑ Lancez la simulation
            </div>
          )}
        </div>
      </div>

      {/* Barre de progression */}
      {isRunning && <ProgressBar elapsed={elapsed} duration={duration} accent={scenario.accent} paused={paused}/>}

      {/* Contrôles */}
      <div style={{display:"flex",gap:8,justifyContent:"center",alignItems:"center",flexWrap:"wrap"}}>
        {!isRunning && (
          <button onClick={start} style={{
            background:`${C.cyan}22`,border:`1px solid ${C.cyan}`,color:C.cyan,
            borderRadius:6,padding:"7px 26px",fontFamily:"monospace",fontSize:12,letterSpacing:2,
            boxShadow:`0 0 12px ${C.cyan}33`}}>▶  SIMULER</button>
        )}
        {isRunning && !isDone && (
          <button onClick={togglePause} style={{
            background:paused?`${C.green}22`:`${C.yellow}22`,
            border:`1px solid ${paused?C.green:C.yellow}`,
            color:paused?C.green:C.yellow,
            borderRadius:6,padding:"7px 22px",fontFamily:"monospace",fontSize:12,letterSpacing:2,
            boxShadow:`0 0 10px ${paused?C.green:C.yellow}33`}}>
            {paused?"▶  REPRENDRE":"⏸  PAUSE"}
          </button>
        )}
        {isRunning && (
          <button onClick={reset} style={{
            background:"#ff335518",border:`1px solid ${C.red}`,color:C.red,
            borderRadius:6,padding:"7px 18px",fontFamily:"monospace",fontSize:12,letterSpacing:2}}>
            ↺  RESET
          </button>
        )}

        {/* ── Contrôle de vitesse ── */}
        <div style={{display:"flex",alignItems:"center",gap:8,
          background:C.panel,border:`1px solid ${C.border}`,
          borderRadius:6,padding:"5px 12px"}}>
          <span style={{color:C.muted,fontSize:9,letterSpacing:1,whiteSpace:"nowrap"}}>⏱ VITESSE</span>
          <input
            type="range" min={0.1} max={3} step={0.05}
            value={speed}
            onChange={e => {
              const v = parseFloat(e.target.value);
              setSpeed(v);
              speedRef.current = v;
            }}
            style={{width:110, accentColor:C.cyan, cursor:"pointer"}}
          />
          {/* Presets */}
          {[0.25, 0.5, 1, 2, 3].map(s => (
            <button key={s} onClick={() => { setSpeed(s); speedRef.current = s; }} style={{
              background: Math.abs(speed - s) < 0.03 ? `${C.cyan}22` : "transparent",
              border:`1px solid ${Math.abs(speed - s) < 0.03 ? C.cyan : C.dim}`,
              color: Math.abs(speed - s) < 0.03 ? C.cyan : C.muted,
              borderRadius:4, padding:"2px 7px",
              fontFamily:"monospace", fontSize:9, letterSpacing:0.5,
            }}>{s}×</button>
          ))}
          <span style={{color:C.cyan,fontFamily:"monospace",fontSize:10,
            minWidth:34,textAlign:"right"}}>
            {speed.toFixed(2)}×
          </span>
        </div>

        {isRunning && (
          <span style={{color:C.muted,fontSize:10,letterSpacing:1}}>
            {paused && "⏸ En pause — lisez l'explication →"}
            {!paused && phase==="arrows"   && "Échange SSH en cours..."}
            {!paused && phase==="hostkey"  && "🔍 Vérification known_hosts..."}
            {!paused && phase==="terminal" && "Terminal client..."}
            {!paused && isDone && (hostkeyResult==="ok"?"✓ Connexion établie":"✗ Connexion bloquée")}
          </span>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
